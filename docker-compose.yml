services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Dùng $MSSQL_SA_PASSWORD (biến env có thật TRONG container, set ở trên)
      # chứ không phải $DB_SA_PASSWORD (biến đó chỉ tồn tại ở máy host, dùng
      # để compose nội suy ra MSSQL_SA_PASSWORD khi tạo container).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: IssueTrackingAPI/IssueTrackingAPI/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=IssueTrackingDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: IssueTrackingAPI
      Jwt__Audience: IssueTrackingAPIClient
      Jwt__ExpiryMinutes: 120
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
